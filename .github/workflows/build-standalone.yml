name: Build standalone macOS app

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE }}
      HAS_NOTARY_KEY: ${{ secrets.NOTARY_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install py2app
        run: python3 -m pip install --upgrade pip py2app

      - name: Build icon
        run: |
          python3 -m pip install pillow
          python3 scripts/make_icon.py

      - name: Build app with py2app
        run: python3 setup.py py2app

      - name: Confirm no Homebrew linkage
        run: |
          set -e
          BAD=$(find dist/typad.app -type f \( -perm -u+x -o -name "*.dylib" -o -name "*.so" \) -print0 \
            | xargs -0 otool -L 2>/dev/null | grep -E "/opt/homebrew|/usr/local/(opt|Cellar)" || true)
          if [ -n "$BAD" ]; then
            echo "Homebrew-linked binaries found:"
            echo "$BAD"
            exit 1
          fi
          echo "No Homebrew references. Standalone build confirmed."

      - name: Binary present
        run: file dist/typad.app/Contents/MacOS/typad

      - name: Ad-hoc sign (no signing secrets configured)
        if: ${{ env.HAS_CERT == '' }}
        run: codesign --force --deep -s - dist/typad.app

      - name: Import signing certificate
        if: ${{ env.HAS_CERT != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain

      - name: Sign with Developer ID (hardened runtime)
        if: ${{ env.HAS_CERT != '' }}
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          codesign --force --deep --options runtime --timestamp \
            --entitlements scripts/runtime.entitlements \
            --sign "$SIGNING_IDENTITY" dist/typad.app

      - name: Notarize and staple
        if: ${{ env.HAS_NOTARY_KEY != '' }}
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > /tmp/notary_key.p8
          ditto -c -k --sequesterRsrc --keepParent dist/typad.app dist/typad-standalone.zip
          xcrun notarytool submit dist/typad-standalone.zip \
            --key /tmp/notary_key.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple dist/typad.app

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent dist/typad.app dist/typad-standalone-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: typad-standalone-macos
          path: dist/typad-standalone-macos.zip

  build-sandboxed:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install py2app + PyObjC
        run: python3 -m pip install --upgrade pip py2app pyobjc-framework-Cocoa pillow

      - name: Run the bookmark/session-restore tests on a real macOS runner
        run: python3 test_texter.py

      - name: Build icon
        run: python3 scripts/make_icon.py

      - name: Build the App Sandbox variant
        env:
          TYPAD_SANDBOX: "1"
        run: python3 setup.py py2app

      - name: Ad-hoc sign with the sandbox entitlement
        run: |
          codesign --force --deep -s - --entitlements scripts/typad.entitlements dist/typad.app

      - name: Confirm the sandbox entitlement is embedded
        run: |
          set -e
          codesign -d --entitlements :- dist/typad.app | tee /tmp/entitlements.xml
          grep -q "com.apple.security.app-sandbox" /tmp/entitlements.xml

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent dist/typad.app dist/typad-sandboxed-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: typad-sandboxed-macos
          path: dist/typad-sandboxed-macos.zip

